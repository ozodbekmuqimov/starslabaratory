<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduLab 3D — 100+ virtual laboratoriya</title>
<style>
:root{--ink:#172033;--muted:#667085;--brand:#087f69;--bg:#eef4f1;--panel:#fff;--line:#dbe5e1}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.top{height:68px;background:#10382f;color:#fff;display:flex;align-items:center;padding:0 24px;gap:18px}
.brand{font-size:21px;font-weight:800}.brand b{color:#72dabd}
.top .spacer{flex:1}
.status{font-size:12px;color:#cce1d9}
.status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#68dcaf;margin-right:7px}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 68px);width:100%}
.sidebar{background:#f8fbfa;border-right:1px solid var(--line);padding:16px 12px;min-width:0}
.side-title{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8a9a94;font-weight:800;margin:8px 12px 10px}
.nav{width:100%;border:0;background:transparent;text-align:left;color:#52625d;border-radius:9px;padding:9px 10px;margin:2px 0;font-weight:700}
.nav span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#edf3f0;margin-right:8px}
.nav:hover{background:#eef5f2}
.nav.active{background:#dcece6;color:var(--brand)}
.main{padding:18px 22px 30px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.head h1{margin:0;font-size:24px}
.head p{margin:3px 0 0;color:var(--muted)}
.btn{border:1px solid #cbd8d3;background:#fff;border-radius:8px;padding:8px 12px;color:#44564f;font-weight:700}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:#b42318;border-color:#f3c7c2}
.btn:active{transform:translateY(1px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;max-width:100%}
.panel h2{font-size:17px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
input,select,textarea{width:100%;border:1px solid #ccd8d3;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #72dabd;outline-offset:1px}
textarea{resize:vertical}
label{display:block;font-size:12px;font-weight:800;color:#66766f;margin-bottom:5px}
.field{margin-bottom:10px}

/* Laboratoriya */
.workspace{height:clamp(300px,56vh,520px);position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#fbfdfc 76%,#bfc5bd 76%)}
.workspace:before{content:"";position:absolute;inset:0 0 24%;background-image:linear-gradient(#edf1ef 1px,transparent 1px),linear-gradient(90deg,#edf1ef 1px,transparent 1px);background-size:34px 34px}
.bench-line{position:absolute;left:0;right:0;bottom:22%;height:18px;background:#969e98}
.flask{position:absolute;left:calc(50% - 75px);bottom:23%;width:150px;height:190px}
.flask-neck{position:absolute;left:50px;bottom:98px;width:50px;height:78px;border:5px solid #91aaa1;border-bottom:0;border-radius:8px 8px 0 0}
.flask-body{position:absolute;bottom:0;left:13px;width:124px;height:105px;border:5px solid #91aaa1;border-top:0;border-radius:12px 12px 58px 58px;overflow:hidden}
.liquid{position:absolute;left:0;right:0;bottom:0;height:44%;background:#72b1dc;transition:height .5s,background .5s}
.liquid:before{content:"";position:absolute;left:0;right:0;top:-7px;height:14px;border-radius:50%;background:inherit}
.optics{position:absolute;inset:0 0 24%;width:100%;height:76%}
.lab-result{margin-top:10px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.control{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px}
.control label{display:flex;justify-content:space-between}
.control input[type=range]{accent-color:var(--brand);padding:0}
.equipment-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 2px}
.equipment-btn{border:1px solid #cbd8d3;background:#fff;border-radius:8px;padding:7px 10px;font-weight:700;color:#53665f}
.equipment-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
.lab-apparatus{position:absolute;pointer-events:none}
.test-tubes{left:calc(50% + 95px);bottom:24%;width:150px;height:105px;display:flex;gap:8px;align-items:flex-end}
.test-tube{position:relative;width:28px;height:82px;border:3px solid #91aaa1;border-top:0;border-radius:0 0 14px 14px;background:#eef8f544}
.test-tube:before{content:"";position:absolute;left:-3px;top:-12px;width:28px;height:10px;border:3px solid #91aaa1;border-bottom:0;border-radius:8px 8px 0 0}
.test-tube i{position:absolute;left:3px;right:3px;bottom:3px;height:32%;background:#78b4d4;border-radius:0 0 10px 10px}
.burner{left:calc(50% - 190px);bottom:24%;width:85px;height:110px}
.burner-base{position:absolute;bottom:0;left:10px;width:65px;height:18px;border-radius:50%;background:#60716b}
.burner-neck{position:absolute;bottom:14px;left:35px;width:15px;height:48px;border-radius:6px;background:#87958f}
.burner-flame{position:absolute;bottom:61px;left:28px;width:30px;height:45px;border-radius:50% 50% 45% 45%;background:linear-gradient(#fff1a6 15%,#ff9c52 55%,#4a90b8);box-shadow:0 0 18px #ffb15a;transform-origin:bottom;animation:flame .35s infinite alternate}
@keyframes flame{from{transform:scaleY(.82) rotate(-2deg)}to{transform:scaleY(1.08) rotate(2deg)}}
.pipette{right:24px;top:20%;width:18px;height:170px;border-radius:8px;background:linear-gradient(90deg,#72978d,#dcebe6,#72978d);transform:rotate(18deg);transform-origin:top}
.pipette:before{content:"";position:absolute;bottom:-18px;left:5px;width:8px;height:22px;background:#91aaa1;clip-path:polygon(0 0,100% 0,50% 100%)}
.pipette:after{content:"";position:absolute;top:-16px;left:-5px;width:28px;height:30px;border-radius:7px;background:#7d918a}
.stand{left:calc(50% - 250px);bottom:24%;width:210px;height:175px}
.stand-post{position:absolute;left:20px;bottom:0;width:12px;height:150px;border-radius:5px;background:#66766f}
.stand-base{position:absolute;left:-5px;bottom:-4px;width:65px;height:11px;border-radius:5px;background:#66766f}
.stand-clamp{position:absolute;left:26px;bottom:105px;width:130px;height:8px;background:#66766f;transform:rotate(-8deg);transform-origin:left}
.stand-clamp:after{content:"";position:absolute;right:-8px;top:-7px;width:18px;height:22px;border:4px solid #66766f;border-radius:5px}

/* Davriy jadval */
.periodic{display:grid;grid-template-columns:repeat(18,minmax(43px,1fr));grid-template-rows:repeat(7,64px) 14px repeat(2,64px);gap:4px;overflow:auto;padding-bottom:5px}
.element{height:64px;border:1px solid #bcd1c8;border-radius:6px;background:#edf7f3;padding:4px;text-align:left;color:#21483e}
.element b{display:block;font-size:18px}
.element small{display:block;font-size:9px}
.element .num{font-size:8px;color:#71817b}
.element:hover{transform:scale(1.06);z-index:2;box-shadow:0 5px 15px #355b5025}
.element.alkali{background:#fde9dd}.element.earth{background:#fbefd3}.element.trans{background:#edf1fa}
.element.post{background:#e6edf1}.element.meta{background:#e9f2dd}.element.nonmetal{background:#edf7f3}
.element.halogen{background:#f7f0dc}.element.noble{background:#faedf4}.element.lan{background:#e8e4f6}.element.act{background:#f6e2e8}
.element-detail{border-left:5px solid var(--brand)}
.atom-stat{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafcfb}
.atom-stat b{display:block;font-size:20px;color:var(--brand)}

/* Molekula */
.molbox{height:420px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at center,#f8fcfa,#e7efeb);position:relative}
.molbox canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.molecule-controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid #ccd8d3;border-radius:99px;background:#fff;padding:7px 11px}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* Konvertor, natija */
.converter-row{display:grid;grid-template-columns:1fr 80px 1fr;gap:10px;align-items:end}
.swap{text-align:center;font-size:24px;color:var(--brand);background:none;border:0}
.result{background:#f1f7f4;border:1px solid #d0e2da;border-radius:9px;padding:12px;margin-top:10px;min-height:56px;font-family:Georgia,serif;font-size:18px;color:#31584e}

/* Ma'lumotnoma, daftarcha, jadval */
.reference,.notebook{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}
.ref-list{display:flex;flex-direction:column;gap:6px}
.ref-item{text-align:left;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px}
.ref-item.active{border-color:var(--brand);background:#edf7f3}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}
.table th{color:#718078;font-size:11px;text-transform:uppercase}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#eef4f1;font-weight:800}
.notes{max-height:520px;overflow:auto}
.note{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:7px;background:#fff;cursor:pointer}
.note.active{border-color:var(--brand);background:#edf7f3}
.note small{display:block;color:var(--muted);margin-top:4px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{border:1px solid var(--line);border-radius:10px;text-align:center;padding:14px;background:#fff}
.badge i{display:block;font-size:28px;font-style:normal}
.badge.locked{filter:grayscale(1);opacity:.55}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#173e34;color:#fff;border-radius:99px;padding:9px 15px;opacity:0;pointer-events:none;transition:.25s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1050px){.layout{grid-template-columns:190px minmax(0,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){
 .top{padding:0 12px}.status{display:none}
 .layout{display:block}
 .sidebar{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
 .side-title{display:none}
 .nav{width:auto;white-space:nowrap}.nav span{display:none}
 .main{padding:10px}
 .grid2,.grid3,.grid4,.reference,.notebook{grid-template-columns:1fr}
 .controls{grid-template-columns:repeat(2,minmax(0,1fr))}
 .equipment-btn{flex:1 1 30%;min-width:78px}
 .head h1{font-size:20px}.head p{display:none}
 .converter-row{grid-template-columns:1fr}.swap{display:none}
 .badges{grid-template-columns:repeat(2,1fr)}
}

/* 3D uslub */
.workspace{background:#e9f1ee}.workspace:before{display:none}
.atomwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;align-items:stretch}
.atomhost{height:250px;border-radius:12px;overflow:hidden;background:#0f2a24}
.periodic{perspective:1200px}
.element{transform-style:preserve-3d;transition:transform .2s,box-shadow .2s;box-shadow:0 3px 0 #b3c9bf,0 6px 10px #35574d22}
.element:hover{transform:translateZ(28px) rotateX(-10deg) scale(1.12);box-shadow:0 12px 22px #35574d55;z-index:3}
.panel{box-shadow:0 1px 0 #fff inset,0 10px 24px -14px #10382f66}
.btn{box-shadow:0 3px 0 #c3d1cb}.btn.primary{box-shadow:0 3px 0 #05604f}
.btn:active{transform:translateY(3px);box-shadow:none}
@media(max-width:720px){.atomwrap{grid-template-columns:1fr}}
.wswrap{position:relative}
.alert3d{position:absolute;inset:0;display:grid;place-items:center;background:#10231dcc;border-radius:12px;z-index:5;padding:12px}
.acard{background:#fff;border-radius:14px;padding:18px 20px;max-width:460px;box-shadow:0 20px 50px #0007;animation:pop .25s}
.acard h2{margin:4px 0 8px}.acard p{margin:6px 0}.aico{font-size:44px}
.ppenote.ok{color:#087f69;font-weight:700}.ppenote.bad{color:#b42318;font-weight:700}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.ppe{display:flex;gap:8px;align-items:center;margin:10px 0 0;font-size:13px;color:#44564f}.ppe input{width:auto}
.alert3d{backdrop-filter:blur(3px)}
.acard.big{max-width:640px;width:100%;max-height:96%;overflow:auto;padding:0}
.ahead{display:flex;gap:14px;align-items:center;padding:16px 20px;color:#fff;border-radius:14px 14px 0 0}
.ahead h2{margin:2px 0 0;font-size:21px}.ahead small{letter-spacing:1.2px;font-weight:800;opacity:.9}.ahead .aico{font-size:40px}
.sev-r{background:linear-gradient(135deg,#b42318,#e5622d)}.sev-o{background:linear-gradient(135deg,#b45309,#e0a030)}.sev-y{background:linear-gradient(135deg,#087f69,#3bb58f)}
.abody{padding:14px 20px 18px}.abody section{margin-bottom:10px}
.abody h4{margin:0 0 4px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#66766f}
.abody p{margin:0 0 6px}.abody ol{margin:0;padding-left:20px}.abody li{margin:2px 0}
.rule{background:#edf7f3;border-left:4px solid var(--brand);border-radius:8px;padding:9px 12px}
.quiz{background:#f7f9f8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.qopt{display:block;width:100%;text-align:left;margin:5px 0;border:1px solid #cbd8d3;background:#fff;border-radius:8px;padding:8px 10px}
.qopt.ok{background:#dcf3e8;border-color:#087f69}.qopt.bad{background:#fde3e0;border-color:#b42318}
.afoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:12px}
.score b{color:var(--brand);font-size:18px}
.hud{position:absolute;left:12px;top:12px;z-index:4;background:#10231ddd;color:#fff;border-radius:12px;padding:9px 12px;display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}
.hbar{width:90px;height:6px;border-radius:9px;background:#ffffff33;overflow:hidden}.hbar i{display:block;height:100%;width:100%;background:#f2c14e}
.hud .btn{padding:4px 8px;font-size:12px}
/* Moslashuvchan dizayn va yangi laboratoriyalar */
.workspace{height:clamp(300px,56vh,520px)}
.controls{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.lab-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filter-chip{border:1px solid #ccd8d3;border-radius:99px;background:#fff;padding:6px 13px;font-weight:700;color:#53665f}
.filter-chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.lab-card{position:relative;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;cursor:pointer;transition:.2s;box-shadow:0 3px 0 #dbe5e1}
.lab-card:hover{transform:translateY(-3px);border-color:var(--brand)}
.lab-card.active{border-color:var(--brand);background:#edf7f3;box-shadow:0 3px 0 var(--brand)}
.lab-card .ico{font-size:30px}.lab-card b{display:block;margin-top:4px}
.lab-card small{display:block;color:var(--muted);line-height:1.35;margin-top:2px}
.lab-card .tag{position:absolute;top:8px;right:8px;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:#edf3f0;color:#44564f}
.tag.chem{background:#fde9dd;color:#9a3b12}.tag.phys{background:#e0f1ee;color:#087f69}.tag.tech{background:#e8e4f6;color:#5b3fb0}.tag.bio{background:#e9f2dd;color:#3a6b12}
.webgl-warn{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;background:#10231dee;color:#ffd0c9;z-index:6}
.webgl-warn b{display:block;font-size:18px;color:#fff;margin-bottom:6px}
.atomhost{position:relative}
.head{flex-wrap:wrap;gap:6px}
@media(max-width:480px){.main{padding:8px}.panel{padding:12px}.head h1{font-size:18px}.lab-grid{grid-template-columns:1fr 1fr}.lab-card{padding:10px}.lab-card .ico{font-size:24px}.ahead{padding:12px}.abody{padding:10px 12px}.hud{left:6px;top:6px}.afoot .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lab-tools{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.lab-tools input{max-width:360px}
.lab-grid{max-height:360px;overflow:auto;padding:2px 4px 6px 2px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.lab-card small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag.earth{background:#e0eaf7;color:#1f4f8f}
.badge small{display:block;margin-top:2px;font-size:11px}
@media(max-width:480px){.lab-grid{max-height:300px;grid-template-columns:1fr 1fr}.lab-tools input{max-width:none}}
</style>


</head>
<body>
<header class="top"><div class="brand"><b>●</b> EduLab</div><div class="spacer"></div><div class="status"><i></i> Offline ham ishlaydi</div></header>
<div class="layout">
<nav class="sidebar" aria-label="Bo‘limlar">
<div class="side-title">Asosiy bo‘limlar</div>
<button type="button" class="nav active" data-page="lab"><span>⚗</span>Virtual laboratoriya</button>
<button type="button" class="nav" data-page="periodic"><span>⊞</span>Interaktiv jadval</button>
<button type="button" class="nav" data-page="molecule"><span>⌬</span>Molekula konstruktori</button>
<button type="button" class="nav" data-page="convert"><span>⇄</span>Birlik konvertori</button>
<button type="button" class="nav" data-page="formula"><span>ƒ</span>Formula kalkulyatori</button>
<button type="button" class="nav" data-page="balance"><span>⚖</span>Tenglamani tenglashtirish</button>
<button type="button" class="nav" data-page="reference"><span>▤</span>Elektron ma’lumotnoma</button>
<button type="button" class="nav" data-page="notebook"><span>✎</span>Virtual daftarcha</button>
<button type="button" class="nav" data-page="teacher"><span>♙</span>O‘qituvchi kabineti</button>
<button type="button" class="nav" data-page="ranking"><span>★</span>O‘quvchi reytingi</button>
</nav>
<main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./three.min.js"></script>
<script>

"use strict";
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={
 get(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast("Saqlab bo‘lmadi (xotira o‘chirilgan)");return false}}
};
let toastTimer;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove("show"),2200)}
function head(title,sub){return `<div class="head"><div><h1>${title}</h1><p>${sub}</p></div></div>`}

/* ---------- Formula tahlili (qavslar bilan) ---------- */
function parseFormula(f){
 const st=[{}];let i=0;
 while(i<f.length){
  const ch=f[i];
  if(ch==="("){st.push({});i++}
  else if(ch===")"){
   i++;const m=f.slice(i).match(/^\d+/),n=m?+m[0]:1;i+=m?m[0].length:0;
   if(st.length<2)return null;
   const g=st.pop(),top=st[st.length-1];
   for(const e in g)top[e]=(top[e]||0)+g[e]*n;
  }else{
   const m=f.slice(i).match(/^([A-Z][a-z]?)(\d*)/);
   if(!m||!(m[1] in masses))return null;
   const top=st[st.length-1];top[m[1]]=(top[m[1]]||0)+(m[2]?+m[2]:1);i+=m[0].length;
  }
 }
 return st.length===1&&Object.keys(st[0]).length?st[0]:null;
}
function molarMass(f){
 const g=parseFormula(f);if(!g)return null;
 let sum=0;for(const e in g)sum+=masses[e]*g[e];
 return{sum,g};
}
/* Tenglashtirish: chiziqli tenglamalar sistemasi (Gauss usuli) */
function balanceEquation(eq){
 const s=eq.replace(/\s/g,"").split(/=|→|->/);
 if(s.length!==2||!s[0]||!s[1])return null;
 const L=s[0].split("+"),R=s[1].split("+"),sp=L.concat(R),comp=sp.map(parseFormula);
 if(comp.some(c=>!c))return null;
 const els=[...new Set(comp.flatMap(c=>Object.keys(c)))];
 const m=els.map(e=>comp.map((c,j)=>(j<L.length?1:-1)*(c[e]||0)));
 const n=sp.length,piv=[];let r=0;
 for(let c=0;c<n&&r<m.length;c++){
  let p=r;for(let i=r+1;i<m.length;i++)if(Math.abs(m[i][c])>Math.abs(m[p][c]))p=i;
  if(Math.abs(m[p][c])<1e-9)continue;
  [m[r],m[p]]=[m[p],m[r]];const d=m[r][c];m[r]=m[r].map(x=>x/d);
  for(let i=0;i<m.length;i++)if(i!==r){const f=m[i][c];if(f)m[i]=m[i].map((x,k)=>x-f*m[r][k])}
  piv.push(c);r++;
 }
 const free=[...Array(n).keys()].filter(c=>!piv.includes(c));
 if(free.length!==1)return null;
 const v=Array(n).fill(0);v[free[0]]=1;piv.forEach((c,i)=>v[c]=-m[i][free[0]]);
 for(let k=1;k<=500;k++){
  const w=v.map(x=>x*k);
  if(w.every(x=>Math.abs(x-Math.round(x))<1e-6)){
   const q=w.map(Math.round);if(q.every(x=>x>0)){
    const t=(f,i)=>(q[i]===1?"":q[i])+f;
    return{left:L.map((f,i)=>t(f,i)),right:R.map((f,i)=>t(f,L.length+i))};
   }
   return null;
  }
 }
 return null;
}

let loops=[];
function stop3d(){loops.forEach(l=>l.dispose());loops=[]}
function make3D(host,o={}){
 if(!window.THREE){host.innerHTML='<div class="webgl-warn"><div><b>3D yuklanmadi</b>Three.js topilmadi.</div></div>';return null}
 const T=THREE,w=host.clientWidth||600,h=host.clientHeight||400;
 let r;try{r=new T.WebGLRenderer({antialias:true})}catch(e){host.innerHTML='<div class="webgl-warn"><div><b>WebGL ishlamayapti</b>Brauzer sozlamalarida apparat tezlatishni yoqing yoki boshqa brauzerdan foydalaning.</div></div>';return null}
 r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(w,h);r.setClearColor(o.bg!=null?o.bg:0xe9f1ee);
 r.shadowMap.enabled=!!o.shadow;r.shadowMap.type=T.PCFSoftShadowMap;
 const cv=r.domElement;cv.style.cssText="display:block;width:100%;height:100%;touch-action:none;cursor:grab";host.appendChild(cv);
 const scene=new T.Scene(),cam=new T.PerspectiveCamera(42,w/h,.1,100),tgt=new T.Vector3(...(o.look||[0,1.5,0]));
 let th=o.theta!=null?o.theta:.5,ph=o.phi||1.2,rad=o.radius||11,drag=false,lx=0,ly=0;
 const place=()=>{cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt)};
 cv.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"};
 cv.onpointermove=e=>{if(!drag)return;th-=(e.clientX-lx)*.008;ph=Math.max(.25,Math.min(1.52,ph-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY};
 cv.onpointerup=cv.onpointercancel=()=>{drag=false;cv.style.cursor="grab"};
 cv.addEventListener("wheel",e=>{e.preventDefault();rad=Math.max(4,Math.min(22,rad*(1+e.deltaY*.001)))},{passive:false});
 const l={scene,T,tick:[],shake:0,dead:false};
 cv.addEventListener("webglcontextlost",e=>{e.preventDefault();if(!l.dead)host.insertAdjacentHTML("beforeend",'<div class="webgl-warn"><div><b>3D kontekst yo‘qoldi</b>Boshqa bo‘limga o‘tib qayting yoki sahifani yangilang.</div></div>')});
 const ro=new ResizeObserver(()=>{const w=host.clientWidth,h=host.clientHeight;if(w&&h){r.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}});ro.observe(host);
 let id,last=0;
 l.dispose=()=>{if(l.dead)return;l.dead=true;cancelAnimationFrame(id);ro.disconnect();scene.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)[].concat(o.material).forEach(m=>m.dispose())});r.dispose();if(r.forceContextLoss)r.forceContextLoss();cv.remove()};
 const loop=t=>{if(!host.isConnected){l.dispose();return}id=requestAnimationFrame(loop);const s=t/1000,dt=Math.min(.05,s-last);last=s;if(o.auto&&!drag)th+=o.auto*dt;place();l.tick.forEach(f=>f(s,dt));if(l.shake>0){cam.position.x+=(Math.random()-.5)*l.shake;cam.position.y+=(Math.random()-.5)*l.shake;l.shake=Math.max(0,l.shake-dt*1.2)}r.render(scene,cam)};
 loops.push(l);id=requestAnimationFrame(loop);
 return l;
}
function lights(S,T,shadow){
 S.add(new T.HemisphereLight(0xffffff,0x7f9088,.75));

 S.add(d);
}

function bindLab(){

  const q=labQuery.trim().toLowerCase(),list=LAB_CARDS.filter(c=>(labFilter==="all"||c.c===labFilter)&&(!q||(c.t+" "+c.d).toLowerCase().includes(q)));
  $("#labCount").textContent=list.length+" ta";
  $("#labGrid").innerHTML=list.length?list.map(c=>`<div class="lab-card${c.id===labCard?" active":""}" data-id="${c.id}" role="button" tabindex="0"><span class="tag ${c.c}">${c.tag}</span><div class="ico">${c.ico}</div><b>${c.t}</b><small>${c.d}</small></div>`).join(""):'<p class="muted">Hech narsa topilmadi.</p>';
  $$(".lab-card").forEach(el=>{el.onclick=()=>pick(el.dataset.id,true);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(el.dataset.id,true)}}});
 };
 const pick=(id,user)=>{
  const c=LAB_CARDS.find(x=>x.id===id);if(!c)return;labCard=id;
  if(LAB){LAB.parts.burner.visible=!!c.preset;LAB.parts.spirit.visible=false;LAB.flame(false)}
  renderLab(c.kind);
  $$(".lab-card").forEach(el=>el.classList.toggle("active",el.dataset.id===id));
  if(user){const vs=store.get("edulab_visited");if(!vs.includes(id)){vs.push(id);store.set("edulab_visited",vs)}$("#labTitle").scrollIntoView({behavior:"smooth",block:"start"})}
 };
 $$(".filter-chip").forEach(b=>b.onclick=()=>{labFilter=b.dataset.f;$$(".filter-chip").forEach(x=>x.classList.toggle("active",x===b));draw()});
 $("#labSearch").oninput=e=>{labQuery=e.target.value;draw()};
 draw();build3DLab();renderLog();pick(labCard,false);
}

function labUpdate(){
 const val=id=>+$("#"+id).value,set=(id,t)=>$("#"+id+"Val").textContent=t,out=$("#labResult");
 if(labs[labKind].more){
  const vals={};labs[labKind].controls.forEach(c=>{vals[c[0]]=val(c[0]);set(c[0],vals[c[0]]+" "+c[5])});
  out.innerHTML=LAB&&LAB.more&&LAB.more[labKind]?LAB.more[labKind](vals):"3D ko‘rinish mavjud emas (WebGL kerak).";return;
 }
 if(labKind==="kimyo"){
  const v=val("volume"),m=val("mol");set("volume",v+" ml");set("mol",m.toFixed(2)+" M");
  const diff=0.025*0.1-v/1000*m,V=(25+v)/1000;
  const pH=Math.abs(diff)<1e-9?7:diff>0?-Math.log10(diff/V):14+Math.log10(-diff/V);
  if(LAB)LAB.chem(v,m,pH);
  out.innerHTML=`25 ml 0.1 M HCl ga ${v} ml NaOH qo‘shildi. pH ≈ <b>${pH.toFixed(2)}</b> ${pH>=8.2?"(fenolftalein pushti)":pH<=6.8?"(kislotali)":"(neytral nuqtaga yaqin)"}`+(pH>=12.5?"<br>⚠ Kuchli ishqor (pH ≥ 12.5): teri va ko‘zni kuydiradi — himoya vositasisiz ishlamang.":v>2.5/m+1?`<br>⚠ Ekvivalent nuqtadan (≈ ${(2.5/m).toFixed(1)} ml) o‘tib ketdingiz. Oxirida bir tomchilab qo‘shing.`:"")+(25+v>70?"<br>⛔ Kolba sig‘imi (70 ml) oshdi!":"");
 }else if(labKind==="fizika"){
  const d=val("distance"),f=val("focus");set("distance",d+" sm");set("focus",f+" sm");
  const r=LAB?LAB.phys(d,f):{inf:Math.abs(d-f)<.01,v:d*f/(d-f),m:-f/(d-f)};
  out.innerHTML=r.inf?"Obyekt fokusda: tasvir cheksizlikda hosil bo‘ladi.":`Tasvir masofasi: <b>${r.v.toFixed(1)} sm</b> (${r.v>0?"haqiqiy, teskari":"mavhum, to‘g‘ri"}), kattalashtirish: <b>${Math.abs(r.m).toFixed(2)}×</b>`;
 }else if(labKind==="elektr"){
  const U=val("volt"),R=val("ohm");set("volt",U+" V");set("ohm",R+" Ω");
  const r=LAB?LAB.elec(U,R):{I:U/R,P:U*U/R};
  out.innerHTML=`Om qonuni: I = U / R = ${U} / ${R} = <b>${r.I.toFixed(2)} A</b>, quvvat P = <b>${r.P.toFixed(1)} Vt</b>`+(r.I>=3.5?"<br>⛔ Xavfli tok! Simlar qizimoqda — kuchlanishni kamaytiring yoki qarshilikni oshiring.":r.I>=1.5?"<br>⚠ Tok kuchi yuqori, simlar iliy bo‘lishi mumkin.":"");
 }else{
  const s=val("sugar"),t=val("time");set("sugar",s+" %");set("time",t+" min");
  const dm=(10-s)*0.3*(1-Math.exp(-t/20));if(LAB)LAB.bio(s,t,dm);
  out.innerHTML=`Hujayra massasi o‘zgarishi (soddalashtirilgan model): <b>${dm>=0?"+":""}${dm.toFixed(1)} %</b> — ${dm>0.05?"suv hujayraga kiradi":dm<-0.05?"suv hujayradan chiqadi":"muvozanat"}`+(dm<=-4?"<br>⚠ Plazmoliz: hujayra suvsizlanib, sitoplazma devordan ajralmoqda.":"")+(dm>=2.5?"<br>⛔ Hujayra yorilish xavfi (lizis)!":"");
 }
}

/* ---------- Davriy jadval ---------- */
function periodicPage(){
 let cells="";
 for(let n=1;n<=118;n++){
  const p=elPos(n),c=catOf(n)[0],m=massList[n-1];
  cells+=`<button type="button" class="element ${c}" style="grid-column:${p[0]};grid-row:${p[1]}" data-el="${n}" title="${esc(names[n-1])}"><span class="num">${n}</span><b>${symbols[n-1]}</b><small>${m.toFixed(2)}</small></button>`;
 }
 return head("Interaktiv Mendeleyev jadvali","Elementni tanlang — atom xossalari ko‘rinadi")+`<div class="panel"><div class="field"><input id="elSearch" placeholder="Element nomi yoki belgisi bo‘yicha izlash…" aria-label="Izlash"></div><div class="periodic" id="periodic">${cells}</div></div><div class="panel element-detail"><div class="atomwrap"><div id="elDetail"></div><div id="atom3d" class="atomhost"></div></div></div>`;
}
let atomEng=null,atomG=null;
function atomInit(){
 atomEng=make3D($("#atom3d"),{auto:.3,theta:.6,phi:1.15,radius:11,look:[0,0,0],bg:0x0f2a24});
 if(!atomEng)return;lights(atomEng.scene,atomEng.T,false);
 atomEng.tick.push((s,dt)=>{if(atomG)atomG.userData.e.forEach(e=>{e.a+=dt*e.sp;const x=Math.cos(e.a)*e.r,z=Math.sin(e.a)*e.r;e.m.position.set(x,z*Math.sin(e.t),z*Math.cos(e.t))})});
}
function setAtom(n){
 if(!atomEng)return;const T=atomEng.T;if(atomG)atomEng.scene.remove(atomG);
 const g=new T.Group();g.userData.e=[];
 const nc=Math.min(12,Math.ceil(n/5)+1);
 for(let i=0;i<nc;i++){const m=new T.Mesh(new T.SphereGeometry(.2,16,16),new T.MeshStandardMaterial({color:i%2?0x4f8bff:0xef5454,roughness:.4}));m.position.set((Math.random()-.5)*.35,(Math.random()-.5)*.35,(Math.random()-.5)*.35);g.add(m)}
 let rem=n;
 [2,8,8,18,18,32,32].forEach((cap,i)=>{
  const c=Math.min(cap,rem);if(c<=0)return;rem-=c;
  const r=1.1+i*.75,t=i*.5;
  const ring=new T.Mesh(new T.TorusGeometry(r,.012,6,80),new T.MeshBasicMaterial({color:0x6f9488}));ring.rotation.x=Math.PI/2-t;g.add(ring);
  for(let j=0;j<c;j++){const m=new T.Mesh(new T.SphereGeometry(.09,10,10),new T.MeshBasicMaterial({color:0x4cc9f0}));g.add(m);g.userData.e.push({m,r,t,a:j/c*6.283,sp:1.4/Math.sqrt(i+1)})}
 });
 atomG=g;atomEng.scene.add(g);
}
function showElement(n){
 const p=elPos(n),isLan=n>=57&&n<=71,isAct=n>=89&&n<=103;
 const period=isLan?6:isAct?7:p[1],group=(isLan||isAct)?"f-blok":p[0],block=(isLan||isAct)?"f":(group<=2||n===2)?"s":group<=12?"d":"p";
 $("#elDetail").innerHTML=`<h2>${esc(names[n-1])} — ${symbols[n-1]}</h2><p class="muted" style="margin-top:-6px">${catOf(n)[1]} · 3D atom modeli taxminiy</p><div class="grid2"><div class="atom-stat"><b>${n}</b>Atom raqami</div><div class="atom-stat"><b>${massList[n-1].toFixed(3)}</b>Nisbiy massa</div><div class="atom-stat"><b>${group}</b>Guruh</div><div class="atom-stat"><b>${period} / ${block}</b>Davr / Blok</div></div>`;
 setAtom(n);
}
function bindPeriodic(){atomInit();
 $("#elSearch").oninput=e=>{
  const q=e.target.value.trim().toLowerCase();
  $$(".element").forEach(b=>{
   const n=+b.dataset.el;
   b.style.opacity=(!q||symbols[n-1].toLowerCase().includes(q)||names[n-1].toLowerCase().includes(q)||String(n)===q)?"":"0.18";
  });
 };
 $$(".element").forEach(b=>b.onclick=()=>showElement(+b.dataset.el));
 showElement(1);
}

/* ---------- Molekula ---------- */
const molecules={
 H2O:{a:[["O",0,0,0],["H",-70,-35,0],["H",70,-35,0]],b:[[0,1],[0,2]]},
 CH4:{a:[["C",0,0,0],["H",0,-75,0],["H",70,30,45],["H",-70,30,45],["H",0,30,-75]],b:[[0,1],[0,2],[0,3],[0,4]]},
 CO2:{a:[["C",0,0,0],["O",-90,0,0],["O",90,0,0]],b:[[0,1],[0,2]]},
 NH3:{a:[["N",0,0,0],["H",0,-70,0],["H",62,35,30],["H",-62,35,30]],b:[[0,1],[0,2],[0,3]]},
 C2H5OH:{a:[["C",-80,0,0],["C",0,0,0],["O",80,0,0],["H",118,-40,0],["H",-120,-45,0],["H",-110,35,45],["H",-110,35,-45],["H",0,55,50],["H",0,55,-50]],b:[[0,1],[1,2],[2,3],[0,4],[0,5],[0,6],[1,7],[1,8]]}
};
let molName="H2O",molEng=null,molGroup=null;
const CPK={H:[0xe8eef5,.32],C:[0x4b5563,.55],O:[0xef4444,.5],N:[0x4f6bff,.5]};
function moleculePage(){
 return head("Molekula konstruktori","3D shar-tayoqcha modeli")+`<div class="panel"><div class="molecule-controls"><button type="button" class="chip active" data-mol="H2O">H₂O</button><button type="button" class="chip" data-mol="CH4">CH₄</button><button type="button" class="chip" data-mol="CO2">CO₂</button><button type="button" class="chip" data-mol="NH3">NH₃</button><button type="button" class="chip" data-mol="C2H5OH">C₂H₅OH</button></div><div class="molbox" id="molBox"></div><p class="muted" style="margin:8px 0 0">Aylantirish uchun suring, yaqinlashtirish uchun g‘ildirakni buring.</p></div>`;
}
function buildMol(){
 if(!molEng)return;const T=molEng.T,k=1/55,mol=molecules[molName];
 if(molGroup)molEng.scene.remove(molGroup);
 const g=new T.Group(),P=mol.a.map(a=>new T.Vector3(a[1]*k,-a[2]*k,a[3]*k));
 mol.a.forEach((a,i)=>{const c=CPK[a[0]],m=new T.Mesh(new T.SphereGeometry(c[1],32,24),new T.MeshStandardMaterial({color:c[0],roughness:.3,metalness:.05}));m.position.copy(P[i]);g.add(m)});
 mol.b.forEach(([i,j])=>{const d=P[j].clone().sub(P[i]),len=d.length(),m=new T.Mesh(new T.CylinderGeometry(.09,.09,len,14),new T.MeshStandardMaterial({color:0xb8c4be,roughness:.4}));m.position.copy(P[i]).add(P[j]).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());g.add(m)});
 molGroup=g;molEng.scene.add(g);
}
function bindMolecule(){
 molEng=make3D($("#molBox"),{auto:.5,theta:.6,phi:1.2,radius:7,look:[0,0,0],bg:0xe3ece8});
 if(!molEng)return;lights(molEng.scene,molEng.T,false);buildMol();
 $$("[data-mol]").forEach(b=>b.onclick=()=>{$$("[data-mol]").forEach(x=>x.classList.remove("active"));b.classList.add("active");molName=b.dataset.mol;buildMol()});
}

/* ---------- Konvertor ---------- */
const units={
 length:["metr|m|1","kilometr|km|1000","santimetr|cm|0.01","millimetr|mm|0.001","dyuym|in|0.0254","milya|mi|1609.344"],
 mass:["kilogramm|kg|1","gramm|g|0.001","milligramm|mg|0.000001","tonna|t|1000","funt|lb|0.453592"],
 time:["sekund|s|1","minut|min|60","soat|h|3600","sutka|d|86400","yil|yr|31557600"],
 area:["kvadrat metr|m²|1","kvadrat kilometr|km²|1000000","gektar|ha|10000","kvadrat santimetr|cm²|0.0001"],
 speed:["metr/sekund|m/s|1","kilometr/soat|km/h|0.277778","milya/soat|mph|0.44704","tugun|kn|0.514444"],
 force:["nyuton|N|1","kilogram-kuch|kgf|9.80665","dyna|dyn|0.00001","funt-kuch|lbf|4.44822"]
};
function convertPage(){
 return head("Fizik kattaliklar konvertori","Uzunlik, massa, vaqt, maydon, tezlik va kuch")+`<div class="panel"><div class="grid2"><div class="field"><label for="cat">Kategoriya</label><select id="cat"><option value="length">Uzunlik</option><option value="mass">Massa</option><option value="time">Vaqt</option><option value="area">Maydon</option><option value="speed">Tezlik</option><option value="force">Kuch</option></select></div><div class="field"><label for="cv">Qiymat</label><input id="cv" type="number" value="1" step="any"></div></div>
<div class="converter-row"><div class="field"><label for="cu1">Qaysi birlikdan</label><select id="cu1"></select></div><button type="button" class="swap" id="swapUnits" aria-label="Almashtirish">⇄</button><div class="field"><label for="cu2">Qaysi birlikka</label><select id="cu2"></select></div></div><div class="result" id="convertResult"></div></div>`;
}
function setupConvert(){
 const opts=units[$("#cat").value].map((x,i)=>{const[n,s]=x.split("|");return`<option value="${i}">${n} (${s})</option>`}).join("");
 $("#cu1").innerHTML=opts;$("#cu2").innerHTML=opts;$("#cu2").selectedIndex=1;convert();
}
function convert(){
 const u=units[$("#cat").value].map(x=>x.split("|")),v=parseFloat($("#cv").value);
 const a=u[+$("#cu1").value],b=u[+$("#cu2").value];
 $("#convertResult").textContent=isNaN(v)?"Son kiriting":(v*+a[2]/+b[2]).toLocaleString("uz-UZ",{maximumFractionDigits:8})+" "+b[1];
}

/* ---------- Formula, tenglama ---------- */

/* ---------- Ma'lumotnoma, daftarcha, kabinet, reyting ---------- */
const refs=[
["Atom","Atom — materiyaning kimyoviy usulda bo‘linmaydigan eng kichik zarrachasi. Proton, neytron va elektronlardan tashkil topgan."],
["Molekula","Molekula — o‘zaro bog‘langan bir necha atomdan iborat barqaror zarracha. Masalan: H₂O, CO₂, O₂."],
["Valentlik","Valentlik — atomning kimyoviy bog‘ hosil qilishda ishtirok etadigan bog‘lanishlari soni."],
["Mol","Mol — 6.022×10²³ ta zarrachani ifodalovchi xalqaro miqdor birligi."],
["Erkin tushish","Erkin tushish tezlanishi yer yuzasida g ≈ 9.81 m/s². v = gt; H = gt²/2."],
["Nyuton qonuni","Ikkinchi qonun: F = ma. Kuch massaning tezlanishga ko‘paytmasiga teng."],
["Elektr toki","Om qonuni: I = U/R. Quvvat: P = UI."]
];
function referencePage(){
 return head("Elektron ma’lumotnoma","Tezkor nazariy materiallar")+`<div class="panel reference"><div class="ref-list" id="refList">${refs.map((r,i)=>`<button type="button" class="ref-item ${i?"":"active"}" data-ref="${i}">${r[0]}</button>`).join("")}</div><div id="refText" style="padding:10px 14px;line-height:1.8"><h2>${refs[0][0]}</h2><p>${refs[0][1]}</p></div></div>`;
}
let noteIdx=0;
function notebookPage(){
 const notes=store.get("edulab_notes");
 const list=notes.length?notes.map((n,i)=>`<div class="note ${i===noteIdx?"active":""}" data-note="${i}"><b>${esc(n.title||"Nomsiz yozuv")}</b><small>${esc(n.date)}</small></div>`).join(""):`<p class="muted">Yozuvlar yo‘q</p>`;
 return head("Virtual daftarcha","Laboratoriya kuzatuv va xulosalarini saqlash")+`<div class="panel notebook"><div class="notes"><button type="button" class="btn primary" id="newNote" style="width:100%;margin-bottom:8px">+ Yangi yozuv</button><div id="noteList">${list}</div></div><div><input id="noteTitle" placeholder="Yozuv nomi" aria-label="Yozuv nomi"><textarea id="noteText" rows="16" placeholder="Kuzatishlar, formulalar va xulosalar…" aria-label="Matn" style="margin-top:8px"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button type="button" class="btn primary" id="saveNote">Saqlash</button><button type="button" class="btn danger" id="delNote">O‘chirish</button></div></div></div>`;
}
function teacherPage(){
 const tasks=store.get("edulab_tasks");
 return head("O‘qituvchi kabineti","Sinf vazifalari, topshiriqlar va statistikani boshqarish")+`<div class="grid3"><div class="panel"><h2>Jami o‘quvchilar</h2><b style="font-size:30px">24</b></div><div class="panel"><h2>Faol vazifalar</h2><b style="font-size:30px">${tasks.length}</b></div><div class="panel"><h2>Topshirilgan</h2><b style="font-size:30px">68%</b></div></div><div class="panel"><h2>Yangi vazifa</h2><div class="grid3"><input id="taskName" placeholder="Vazifa nomi" aria-label="Vazifa nomi"><input id="taskDate" type="date" aria-label="Muddati"><button type="button" class="btn primary" id="addTask">Qo‘shish</button></div></div><div class="panel" style="overflow:auto"><h2>Vazifalar</h2><table class="table"><thead><tr><th>Vazifa</th><th>Muddati</th><th>Holati</th></tr></thead><tbody>${tasks.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.date)}</td><td>Faol</td></tr>`).join("")||`<tr><td colspan="3">Vazifalar mavjud emas</td></tr>`}</tbody></table></div>`;
}

 const st=[["Aziza Karimova",980,"💎"],["Jasurbek Aliyev",925,"🥇"],["Malika Xolmirzayeva",890,"🥈"],["Sherzod Rahimov",845,"🥉"],["Dilnoza Saidova",800,"⭐"],["Bekzod Toshpo‘latov",760,"⭐"]];

/* ---------- Sahifalarni ulash ---------- */
function bindNotebook(){
 const notes=store.get("edulab_notes"),fill=n=>{$("#noteTitle").value=n?n.title:"";$("#noteText").value=n?n.text||"":""};
 if(noteIdx>=notes.length)noteIdx=0;
 fill(notes[noteIdx]);
 $("#saveNote").onclick=()=>{
  const title=$("#noteTitle").value.trim(),text=$("#noteText").value.trim();
  if(!title&&!text)return toast("Yozuv bo‘sh");
  const item={title:title||"Nomsiz yozuv",text,date:new Date().toLocaleDateString("uz-UZ")};
  if(notes[noteIdx]&&$("#noteList .note.active"))notes[noteIdx]=item;else{notes.unshift(item);noteIdx=0}
  if(store.set("edulab_notes",notes)){toast("Yozuv saqlandi");renderPage("notebook")}
 };
 $$(".note").forEach(n=>n.onclick=()=>{noteIdx=+n.dataset.note;$$(".note").forEach(x=>x.classList.toggle("active",x===n));fill(notes[noteIdx])});
 $("#newNote").onclick=()=>{$$(".note").forEach(x=>x.classList.remove("active"));fill(null);$("#noteTitle").focus()};
 $("#delNote").onclick=()=>{
  const act=$("#noteList .note.active");if(!act)return toast("Yozuv tanlanmagan");
  notes.splice(noteIdx,1);noteIdx=0;store.set("edulab_notes",notes);toast("Yozuv o‘chirildi");renderPage("notebook");
 };
}
function renderPage(page){
 stop3d();
 $$(".nav").forEach(n=>{const a=n.dataset.page===page;n.classList.toggle("active",a);a?n.setAttribute("aria-current","page"):n.removeAttribute("aria-current")});
 const pages={lab:labPage,periodic:periodicPage,molecule:moleculePage,convert:convertPage,formula:formulaPage,balance:balancePage,reference:referencePage,notebook:notebookPage,teacher:teacherPage,ranking:rankingPage};
 $("#main").innerHTML=(pages[page]||rankingPage)();
 if(page==="lab"){
  bindLab();
 }
 if(page==="periodic")bindPeriodic();
 if(page==="molecule")bindMolecule();
 if(page==="convert"){
  setupConvert();$("#cat").onchange=setupConvert;$("#cv").oninput=convert;$("#cu1").onchange=convert;$("#cu2").onchange=convert;
  $("#swapUnits").onclick=()=>{const a=$("#cu1").selectedIndex;$("#cu1").selectedIndex=$("#cu2").selectedIndex;$("#cu2").selectedIndex=a;convert()};
 }
 if(page==="formula"){
  const run=()=>{const r=molarMass($("#formulaInput").value.trim());
   $("#formulaResult").innerHTML=r?`Molar massa: <b>${r.sum.toFixed(3)} g/mol</b><br>Elementlar: ${Object.entries(r.g).map(x=>esc(x[0])+" — "+x[1]+" atom").join(", ")}`:"Noto‘g‘ri yoki noma’lum formula"};
  $("#calcFormula").onclick=run;$("#formulaInput").onkeydown=e=>{if(e.key==="Enter")run()};run();
 }
 if(page==="balance"){
  const run=()=>{const r=balanceEquation($("#equationInput").value);
   $("#balanceResult").textContent=r?r.left.join(" + ")+" → "+r.right.join(" + "):"Koeffitsiyentlarni topib bo‘lmadi"};
  $("#calcBalance").onclick=run;$("#equationInput").onkeydown=e=>{if(e.key==="Enter")run()};run();
 }
 if(page==="reference")$$(".ref-item").forEach(b=>b.onclick=()=>{
  $$(".ref-item").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  const r=refs[+b.dataset.ref];$("#refText").innerHTML=`<h2>${r[0]}</h2><p>${r[1]}</p>`;
 });
 if(page==="notebook")bindNotebook();
 if(page==="teacher")$("#addTask").onclick=()=>{
  const name=$("#taskName").value.trim(),date=$("#taskDate").value;
  if(!name||!date)return toast("Vazifa va muddatni kiriting");
  const tasks=store.get("edulab_tasks");tasks.unshift({name,date});
  if(store.set("edulab_tasks",tasks)){toast("Vazifa qo‘shildi");renderPage("teacher")}
 };
}
$$(".nav").forEach(b=>b.onclick=()=>renderPage(b.dataset.page));
renderPage("lab");
</script>
